<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أدوات آرك العربية - Keira Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2ecc71;
            --accent: #e74c3c;
            --dark: #2c3e50;
            --light: #f1f2f6;
            --background: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --header-text: white;
            --copy-btn-bg: #2c3e50;
            --copy-btn-text: white;
            --border-color: #e1e8ed;
        }

        body.dark-mode {
            --background: #12121a;
            --card-bg: #1a1a2e;
            --light: #16213e;
            --dark: #ecf0f1;
            --text-color: #f0f0f0;
            --header-text: #f0f0f0;
            --copy-btn-bg: #0f3460;
            --copy-btn-text: #f0f0f0;
            --border-color: #2a2a40;
        }

        body {
            font-family: 'Tajawal', 'Arial', sans-serif;
            background: var(--background);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background 0.4s ease, color 0.4s ease;
            min-height: 100vh;
            position: relative;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        header {
            text-align: center;
            padding: 2.5rem 2rem;
            color: var(--header-text);
            border-radius: 16px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('https://cdn.cloudflare.steamstatic.com/steam/apps/346110/ss_48009597ea5cf8ee683e0dcdc8486b5aeddb952e.1920x1080.jpg?t=1655137924');
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
        }

        header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .social-btn {
            padding: 10px 22px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-family: 'Tajawal', sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        .youtube-btn { background: #ff0000; color: white; }
        .discord-btn { background: #5865F2; color: white; }
        .donate-btn { background: var(--accent); color: white; }

        .tool-card {
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden;
            margin-bottom: 1.2rem;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .tool-card:hover {
            box-shadow: 0 6px 22px rgba(0,0,0,0.08);
        }

        .tool-header {
            padding: 1.2rem 1.5rem;
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease;
            border-bottom: 1px solid transparent;
        }

        .tool-header:hover {
            background: rgba(52, 152, 219, 0.05);
        }

        .tool-header h3 {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.15rem;
            color: var(--text-color);
        }

        .tool-header h3 i {
            color: var(--primary);
        }

        .tool-content {
            padding: 1.5rem;
            display: none; /* مغلقة افتراضياً تماماً كما طلبت */
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
        }

        .input-group {
            margin-bottom: 0.5rem;
        }

        .input-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .input-field {
            flex: 1;
            min-width: 220px;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-color);
        }

        input, select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s, background 0.3s;
            background-color: var(--background);
            color: var(--text-color);
            font-family: 'Tajawal', sans-serif;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }

        .btn {
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--secondary); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-gray { background: #6c757d; color: white; }

        .btn:hover {
            opacity: 0.92;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .code-container {
            position: relative;
            margin-top: 1.2rem;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .code-box {
            background: #0f172a;
            padding: 1.2rem;
            border-radius: 8px;
            overflow-x: auto;
            direction: ltr;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            color: #38bdf8;
            min-height: 40px;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--copy-btn-bg);
            color: var(--copy-btn-text);
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            z-index: 2;
            font-family: 'Tajawal', sans-serif;
        }

        .copy-btn:hover {
            background: var(--primary);
            color: white;
        }

        .theme-toggle {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 48px;
            height: 48px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            z-index: 100;
            transition: transform 0.3s;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .stats-btn {
            position: fixed;
            bottom: 25px;
            left: 25px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            z-index: 100;
            transition: all 0.3s;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
        }

        .stats-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        @media (max-width: 768px) {
            .input-row {
                flex-direction: column;
                gap: 0.8rem;
            }
            .input-field {
                min-width: 100%;
            }
            .theme-toggle {
                bottom: 15px;
                right: 15px;
                width: 42px;
                height: 42px;
                font-size: 15px;
            }
            .stats-btn {
                bottom: 15px;
                left: 15px;
                padding: 8px 15px;
                font-size: 13px;
            }
            header {
                padding: 1.8rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-dragon"></i> أدوات آرك العربية</h1>
            <p>أدوات ذكية لمجتمع آرك العربي - من الألف إلى الياء</p>
            <div class="social-buttons">
                <button class="social-btn youtube-btn" onclick="window.open('https://www.youtube.com/@ikeira1')">
                    <i class="fab fa-youtube"></i> قناتي على اليوتيوب
                </button>
                <button class="social-btn discord-btn" onclick="window.open('https://discord.gg/2rMzBv6zRv')">
                    <i class="fab fa-discord"></i> سيرفر الديسكورد
                </button>
                <button class="social-btn donate-btn" onclick="window.open('https://tip.dokan.sa/keira')">
                    <i class="fas fa-heart"></i> دعم المطور
                </button>
            </div>
        </header>

        <!-- أداة إنشاء المستويات وحساب الخبرة -->
        <div class="tool-card">
            <div class="tool-header" onclick="toggleTool(this)">
                <h3><i class="fas fa-level-up-alt"></i> أداة إنشاء المستويات وحساب الخبرة</h3>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="tool-content">
                <div class="input-group">
                    <div class="input-row">
                        <div class="input-field">
                            <label for="maxLevel"><i class="fas fa-layer-group"></i> المستوى الأقصى</label>
                            <input type="number" id="maxLevel" min="1" max="200" placeholder="مثال: 100">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="generateLevelCode()">
                        <i class="fas fa-code"></i> إنشاء كود المستويات
                    </button>
                </div>
                
                <div class="code-container">
                    <button class="copy-btn" onclick="copyCode(this)"><i class="fas fa-copy"></i> نسخ</button>
                    <div class="code-box" id="levelCode"></div>
                </div>

                <div style="margin-top: 15px;">
                    <button class="btn btn-secondary" onclick="calculateTotalXP()">
                        <i class="fas fa-calculator"></i> حساب الخبرة الكلية
                    </button>
                </div>
                
                <div class="code-container">
                    <button class="copy-btn" onclick="copyCode(this)"><i class="fas fa-copy"></i> نسخ</button>
                    <div class="code-box" id="totalXP"></div>
                </div>
            </div>
        </div>

        <!-- أداة نقاط الإنغرام -->
        <div class="tool-card">
            <div class="tool-header" onclick="toggleTool(this)">
                <h3><i class="fas fa-scroll"></i> أداة نقاط الإنغرام</h3>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="tool-content">
                <div class="input-group">
                    <div class="input-row">
                        <div class="input-field">
                            <label for="engramLevel"><i class="fas fa-layer-group"></i> المستوى المطلوب</label>
                            <input type="number" id="engramLevel" min="1" max="200" placeholder="مثال: 60">
                        </div>
                        <div class="input-field">
                            <label for="engramPoints"><i class="fas fa-star"></i> النقاط لكل مستوى</label>
                            <input type="number" id="engramPoints" min="1" value="8" placeholder="النقاط الأساسية">
                        </div>
                        <div class="input-field">
                            <label for="engramBoostLevel"><i class="fas fa-rocket"></i> تعزيز النقاط بعد مستوى</label>
                            <input type="number" id="engramBoostLevel" min="1" max="200" value="10" placeholder="المستوى">
                        </div>
                        <div class="input-field">
                            <label for="engramBoostPoints"><i class="fas fa-bolt"></i> نقاط التعزيز</label>
                            <input type="number" id="engramBoostPoints" min="1" value="14" placeholder="نقاط إضافية">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="generateEngramPoints()">
                        <i class="fas fa-code"></i> إنشاء كود الإنغرام
                    </button>
                </div>
                
                <div class="code-container">
                    <button class="copy-btn" onclick="copyCode(this)"><i class="fas fa-copy"></i> نسخ</button>
                    <div class="code-box" id="engramOutput"></div>
                </div>
            </div>
        </div>

        <!-- أداة تعديل متطلبات الصنع -->
        <div class="tool-card">
            <div class="tool-header" onclick="toggleTool(this)">
                <h3><i class="fas fa-hammer"></i> أداة تعديل متطلبات الصنع</h3>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="tool-content">
                <div class="input-group">
                    <div class="input-row">
                        <div class="input-field">
                            <label for="itemId"><i class="fas fa-cube"></i> ID العنصر</label>
                            <input type="text" id="itemId" placeholder="مثال: SoulTerminal_DS_C">
                        </div>
                    </div>
                    
                    <div id="resourceRequirements">
                        <div class="input-row resource-row">
                            <div class="input-field">
                                <label>مادة 1</label>
                                <div class="input-row">
                                    <input type="text" class="resource-id" placeholder="ID المادة (مثال: PrimalItemResource_MetalIngot_C)">
                                    <input type="number" class="resource-amount" placeholder="الكمية" min="1" value="100">
                                    <button class="btn btn-accent" onclick="removeResource(this)"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div style="margin-bottom: 15px;">
                        <button class="btn btn-secondary" onclick="addResource()">
                            <i class="fas fa-plus"></i> إضافة مادة جديدة
                        </button>
                    </div>
                    
                    <div class="input-row">
                        <button class="btn btn-primary" onclick="generateCraftingCode()">
                            <i class="fas fa-code"></i> إنشاء كود الصنع
                        </button>
                        <button class="btn btn-gray" onclick="window.open('https://ark.fandom.com/wiki/Item_IDs')">
                            <i class="fas fa-external-link-alt"></i> البحث عن ID العناصر
                        </button>
                    </div>
                </div>
                
                <div class="code-container">
                    <button class="copy-btn" onclick="copyCode(this)"><i class="fas fa-copy"></i> نسخ</button>
                    <div class="code-box" id="craftingOutput"></div>
                </div>
            </div>
        </div>

        <!-- أداة استدعاء الديناصورات -->
        <div class="tool-card">
            <div class="tool-header" onclick="toggleTool(this)">
                <h3><i class="fas fa-paw"></i> أداة استدعاء الديناصورات</h3>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="tool-content">
                <div class="input-group">
                    <div class="input-row">
                        <div class="input-field">
                            <label for="dinoId"><i class="fas fa-dragon"></i> ID الديناصور</label>
                            <input type="text" id="dinoId" placeholder="مثال: Gigant_Character_BP_C">
                        </div>
                        <div class="input-field">
                            <label for="dinoLevel"><i class="fas fa-level-up-alt"></i> المستوى</label>
                            <input type="number" id="dinoLevel" min="1" placeholder="مثال: 60">
                        </div>
                    </div>
                    
                    <div class="input-row">
                        <button class="btn btn-primary" onclick="generateDinoCode()">
                            <i class="fas fa-code"></i> إنشاء كود الاستدعاء
                        </button>
                        <button class="btn btn-gray" onclick="window.open('https://ark.fandom.com/wiki/Item_IDs')">
                            <i class="fas fa-external-link-alt"></i> البحث عن ID الديناصورات
                        </button>
                    </div>
                </div>
                
                <div class="code-container">
                    <button class="copy-btn" onclick="copyCode(this)"><i class="fas fa-copy"></i> نسخ</button>
                    <div class="code-box" id="dinoOutput"></div>
                </div>
            </div>
        </div>
    </div>

    <button class="theme-toggle" onclick="toggleTheme()" title="تغيير المظهر">
        <i class="fas fa-moon"></i>
    </button>

    <button class="stats-btn" onclick="window.open('http://arksurvivalevolved.gamewalkthrough-universe.com/dedicatedservers/customizationtools/perlevelstatsmultipliertool/Default.aspx')">
        <i class="fas fa-chart-line"></i> إنشاء كود الستاتس
    </button>

    <script>
        // توليد كود المستويات مع XP معدل
        function generateLevelCode() {
            const maxLevel = parseInt(document.getElementById('maxLevel').value) || 100;
            let xpArray = [];
            let code = 'LevelExperienceRampOverrides=(';
            
            for(let i = 0; i <= maxLevel; i++) {
                let xp;
                if (i <= 10) {
                    xp = Math.floor(5 + (i * 5));
                } else if (i <= 30) {
                    xp = Math.floor(50 + Math.pow(i-10, 2) * 0.8);
                } else if (i <= 60) {
                    xp = Math.floor(400 + Math.pow(i-30, 2) * 1.5);
                } else {
                    xp = Math.floor(2000 + Math.pow(i-60, 3) * 0.5);
                }
                
                xpArray.push(xp);
                code += `ExperiencePointsForLevel[${i}]=${xp},`;
            }
            
            localStorage.setItem('currentXPArray', JSON.stringify(xpArray));
            code = code.slice(0, -1) + ')';
            document.getElementById('levelCode').innerHTML = code;
        }

        // حساب الخبرة الكلية
        function calculateTotalXP() {
            const xpArray = JSON.parse(localStorage.getItem('currentXPArray')) || [];
            const totalXP = xpArray.reduce((acc, curr) => acc + curr, 0);
            
            const output = `OverrideMaxExperiencePointsPlayer=70368744177664\n`
                         + `OverrideMaxExperiencePointsPlayer=${totalXP}\n`
                         + `OverrideMaxExperiencePointsDino=2147483647`;
            
            document.getElementById('totalXP').innerHTML = output;
        }

        // توليد نقاط الإنغرام
        function generateEngramPoints() {
            const maxLevel = parseInt(document.getElementById('engramLevel').value) || 60;
            const basePoints = parseInt(document.getElementById('engramPoints').value) || 8;
            const boostLevel = parseInt(document.getElementById('engramBoostLevel').value) || 10;
            const boostPoints = parseInt(document.getElementById('engramBoostPoints').value) || 14;
            
            let code = '';
            
            for(let i = 0; i <= maxLevel; i++) {
                const points = i < boostLevel ? basePoints : boostPoints;
                code += `OverridePlayerLevelEngramPoints=${points}\n`;
            }
            
            document.getElementById('engramOutput').innerHTML = code;
        }

        // إضافة مورد جديد لأداة الصنع
        function addResource() {
            const container = document.getElementById('resourceRequirements');
            const newRow = document.createElement('div');
            newRow.className = 'input-row resource-row';
            newRow.innerHTML = `
                <div class="input-field">
                    <label>مادة ${container.children.length + 1}</label>
                    <div class="input-row">
                        <input type="text" class="resource-id" placeholder="ID المادة">
                        <input type="number" class="resource-amount" placeholder="الكمية" min="1" value="100">
                        <button class="btn btn-accent" onclick="removeResource(this)"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
            container.appendChild(newRow);
        }

        // إزالة مورد من أداة الصنع
        function removeResource(btn) {
            const row = btn.closest('.resource-row');
            row.remove();
            updateResourceLabels();
        }

        // تحديث تسميات الموارد
        function updateResourceLabels() {
            const rows = document.querySelectorAll('.resource-row');
            rows.forEach((row, index) => {
                row.querySelector('label').textContent = `مادة ${index + 1}`;
            });
        }

        // توليد كود الصنع
        function generateCraftingCode() {
            const itemId = document.getElementById('itemId').value || 'SoulTerminal_DS_C';
            const resources = [];
            
            document.querySelectorAll('.resource-row').forEach(row => {
                const id = row.querySelector('.resource-id').value;
                const amount = row.querySelector('.resource-amount').value;
                
                if (id && amount) {
                    resources.push({
                        id: id,
                        amount: parseFloat(amount)
                    });
                }
            });
            
            if (resources.length === 0) {
                alert('الرجاء إضافة مواد على الأقل');
                return;
            }
            
            let requirements = '';
            resources.forEach(res => {
                requirements += `(ResourceItemTypeString="${res.id}",BaseResourceRequirement=${res.amount},bCraftingRequireExactResourceType=false),`;
            });
            
            const code = `ConfigOverrideItemCraftingCosts=(ItemClassString="${itemId}",BaseCraftingResourceRequirements=(${requirements.slice(0, -1)}))`;
            document.getElementById('craftingOutput').innerHTML = code;
        }

        // توليد كود استدعاء الديناصور
        function generateDinoCode() {
            const dinoId = document.getElementById('dinoId').value || 'Gigant_Character_BP_C';
            const level = document.getElementById('dinoLevel').value || 60;
            
            const code = `cheat gmsummon "${dinoId}" ${level} 1 0`;
            document.getElementById('dinoOutput').innerHTML = code;
        }

        // تبديل الوضع الليلي
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = document.querySelector('.theme-toggle i');
            
            if (document.body.classList.contains('dark-mode')) {
                icon.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('darkMode', 'enabled');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('darkMode', 'disabled');
            }
        }

        // نسخ النص
        function copyCode(btn) {
            const codeBox = btn.nextElementSibling;
            const text = codeBox.innerText;
            navigator.clipboard.writeText(text);
            
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> تم النسخ!';
            setTimeout(() => {
                btn.innerHTML = originalText;
            }, 2000);
        }

        // تبديل عرض الأداة (مغلقة افتراضياً)
        function toggleTool(header) {
            const toolCard = header.parentElement;
            const content = toolCard.querySelector('.tool-content');
            const icon = header.querySelector('.fa-chevron-down, .fa-chevron-up');
            
            if (content.style.display === 'block') {
                content.style.display = 'none';
                icon.classList.replace('fa-chevron-up', 'fa-chevron-down');
            } else {
                content.style.display = 'block';
                icon.classList.replace('fa-chevron-down', 'fa-chevron-up');
            }
        }

        // تهيئة الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            // إضافة مورد افتراضي واحد لأداة الصنع عند البدء
            addResource();
            
            // استرجاع تفضيل الوضع الليلي
            if (localStorage.getItem('darkMode') === 'enabled') {
                document.body.classList.add('dark-mode');
                const icon = document.querySelector('.theme-toggle i');
                icon.classList.replace('fa-moon', 'fa-sun');
            }
        });
    </script>
</body>
</html>
