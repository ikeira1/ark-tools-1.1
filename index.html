<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدوات سيرفر أرك</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="theme-toggle" onclick="toggleTheme()">
        <i class="fas fa-moon"></i>
    </div>

    <div class="container">
        <!-- أداة توليد مستويات اللاعبين -->
        <div class="tool-card">
            <div class="tool-header" onclick="toggleTool(this)">
                <h2><i class="fas fa-layer-group"></i> مولد مستويات اللاعبين (Level Experience Ramp)</h2>
                <i class="fas fa-chevron-up"></i>
            </div>
            <div class="tool-content">
                <div class="input-row">
                    <div class="input-field">
                        <label>الحد الأقصى للمستوى (Max Level)</label>
                        <input type="number" id="maxLevel" value="100" min="1">
                    </div>
                    <button class="btn btn-primary" onclick="generateLevelCode()"><i class="fas fa-cogs"></i> توليد الكود</button>
                </div>
                <button class="btn btn-accent" onclick="copyCustomCodeBox(this)"><i class="fas fa-copy"></i> نسخ الكود</button>
                <div class="output-box" id="levelCode"></div>
            </div>
        </div>

        <!-- أداة تجاوز الحد الأقصى للخبرة -->
        <div class="tool-card">
            <div class="tool-header" onclick="toggleTool(this)">
                <h2><i class="fas fa-star"></i> أداة تجاوز الحد الأقصى للخبرة (Max Experience)</h2>
                <i class="fas fa-chevron-up"></i>
            </div>
            <div class="tool-content">
                <button class="btn btn-primary" onclick="calculateTotalXP()"><i class="fas fa-calculator"></i> حساب وحفظ كود الخبرة الإجمالي</button>
                <button class="btn btn-accent" onclick="copyCustomCodeBox(this)"><i class="fas fa-copy"></i> نسخ الكود</button>
                <div class="output-box" id="totalXP"></div>
            </div>
        </div>

        <!-- أداة نقاط الإنغرامات -->
        <div class="tool-card">
            <div class="tool-header" onclick="toggleTool(this)">
                <h2><i class="fas fa-brain"></i> أداة نقاط الإنغرامات لكل مستوى</h2>
                <i class="fas fa-chevron-up"></i>
            </div>
            <div class="tool-content">
                <div class="input-row">
                    <div class="input-field">
                        <label>إلى مستوى</label>
                        <input type="number" id="engramLevel" value="60">
                    </div>
                    <div class="input-field">
                        <label>النقاط الأساسية</label>
                        <input type="number" id="engramPoints" value="8">
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-field">
                        <label>بدءاً من مستوى (Boost Level)</label>
                        <input type="number" id="engramBoostLevel" value="10">
                    </div>
                    <div class="input-field">
                        <label>النقاط بعد البوست</label>
                        <input type="number" id="engramBoostPoints" value="14">
                    </div>
                    <button class="btn btn-primary" onclick="generateEngramPoints()"><i class="fas fa-cogs"></i> توليد</button>
                </div>
                <button class="btn btn-accent" onclick="copyCustomCodeBox(this)"><i class="fas fa-copy"></i> نسخ الكود</button>
                <div class="output-box" id="engramOutput"></div>
            </div>
        </div>

        <!-- أداة تخصيص تكلفة صناعة العناصر -->
        <div class="tool-card">
            <div class="tool-header" onclick="toggleTool(this)">
                <h2><i class="fas fa-hammer"></i> أداة تخصيص تكلفة صناعة العناصر (Crafting Costs)</h2>
                <i class="fas fa-chevron-up"></i>
            </div>
            <div class="tool-content">
                <div class="input-field">
                    <label>معرف العنصر المراد تعديل تكلفته (Item ID / ClassString)</label>
                    <input type="text" id="itemId" value="SoulTerminal_DS_C" placeholder="مثال: SoulTerminal_DS_C">
                </div>
                
                <div id="resourceRequirements" class="resources-container">
                    <!-- الصفوف تضاف ديناميكياً هنا -->
                </div>

                <div class="config-actions">
                    <button class="btn btn-primary" onclick="addResource()"><i class="fas fa-plus"></i> إضافة مادة مطلوبة</button>
                    <button class="btn btn-accent" onclick="generateCraftingCode()"><i class="fas fa-code"></i> توليد الكود</button>
                </div>
                <button class="btn btn-accent" onclick="copyCustomCodeBox(this)"><i class="fas fa-copy"></i> نسخ الكود</button>
                <div class="output-box" id="craftingOutput"></div>
            </div>
        </div>

        <!-- أداة استدعاء الديناصورات -->
        <div class="tool-card">
            <div class="tool-header" onclick="toggleTool(this)">
                <h2><i class="fas fa-dragon"></i> أداة استدعاء الديناصورات المروضة (GMSummon)</h2>
                <i class="fas fa-chevron-up"></i>
            </div>
            <div class="tool-content">
                <div class="input-row">
                    <div class="input-field">
                        <label>معرف الديناصور (Blueprint)</label>
                        <input type="text" id="dinoId" value="Gigant_Character_BP_C">
                    </div>
                    <div class="input-field">
                        <label>مستوى الديناصور (Level)</label>
                        <input type="number" id="dinoLevel" value="60">
                    </div>
                    <button class="btn btn-primary" onclick="generateDinoCode()"><i class="fas fa-terminal"></i> توليد الأمر</button>
                </div>
                <button class="btn btn-accent" onclick="copyCustomCodeBox(this)"><i class="fas fa-copy"></i> نسخ الأمر</button>
                <div class="output-box" id="dinoOutput"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
